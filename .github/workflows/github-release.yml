name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: "Release tag, for example v0.1.0"
        required: true
      packageVersion:
        description: "MSIX package version"
        required: false
        default: "1.0.0.0"
      prerelease:
        description: "Mark release as prerelease"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest
    env:
      IPTV_MSIX_CERT_BASE64: ${{ secrets.IPTV_MSIX_CERT_BASE64 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\Iptv.slnx

      - name: Build
        run: dotnet build .\Iptv.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\Iptv.slnx --configuration Release --no-build

      - name: Decode signing certificate
        if: ${{ env.IPTV_MSIX_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\iptv-msix.pfx", [Convert]::FromBase64String($env:IPTV_MSIX_CERT_BASE64))

      - name: Package release artifacts
        shell: pwsh
        env:
          IPTV_MSIX_CERT_PASSWORD: ${{ secrets.IPTV_MSIX_CERT_PASSWORD }}
        run: |
          $cert = "$env:RUNNER_TEMP\iptv-msix.pfx"
          $packageArgs = @{
            Configuration = "Release"
            Runtime = "win-x64"
            OutputRoot = ".\artifacts\release"
            CreateMsix = $true
            Version = "${{ inputs.packageVersion }}"
          }
          if (Test-Path $cert) {
            $packageArgs["SignCertificatePath"] = $cert
          }
          & .\tools\package-release.ps1 @packageArgs

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tagName }}
          name: IPTV Viewer ${{ inputs.tagName }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/release/IptvViewer-win-x64.zip
            artifacts/release/IptvViewer-win-x64.msix
